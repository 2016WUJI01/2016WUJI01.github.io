<footer class="site-footer">
  <div class="container">
    <div class="footer-grid">
      <div class="footer-info">
        <p class="footer-name">{{ site.data.personal.name }}</p>
        <p class="footer-affiliation">{{ site.data.personal.affiliation }}</p>
        <p class="footer-copy">
          &copy; {{ 'now' | date: "%Y" }} {{ site.data.personal.name | split: '(' | first | strip }}. All rights reserved.
        </p>
      </div>
      {% include social-links.html class="social-links--footer" %}
    </div>
  </div>
</footer>
