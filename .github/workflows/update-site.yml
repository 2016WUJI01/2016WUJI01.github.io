name: 更新站点

# al-folio 站点：每周一更新论文（papers.bib），每次推送 master/main 时
# 生成系列合订 PDF、构建 Jekyll，再把 _site 部署到 gh-pages 分支。
# 注意：仓库 Settings → Pages 的发布来源要选 “Deploy from a branch: gh-pages / (root)”。

on:
  schedule:
    - cron: "0 0 * * 1" # 每周一 UTC 00:00（北京时间 08:00）
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  update-data:
    name: 更新论文
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 Python 依赖
        run: pip install -r scripts/requirements.txt

      - name: 从 Google Scholar 追加新论文到 papers.bib
        run: python3 scripts/update_publications.py
        continue-on-error: true # Scholar 常限流，失败不影响部署

      - name: 提交更改
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add _bibliography/papers.bib
          git diff --staged --quiet || git commit -m "自动更新: 论文列表 [skip ci]"
          git push
        continue-on-error: true

  build-and-deploy:
    name: 构建和部署
    runs-on: ubuntu-latest
    needs: update-data
    if: always()
    steps:
      - name: 检出代码（含上一步的论文提交）
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: 拉取最新提交
        run: git pull --ff-only || true

      - name: 设置 Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3.5"
          bundler-cache: true

      - name: 安装 ImageMagick（al-folio 响应式图片）
        run: sudo apt-get update && sudo apt-get install -y imagemagick

      - name: 安装 Pandoc、XeLaTeX 与中文字体
        id: pdf_deps
        run: bash scripts/install_pdf_deps.sh
        continue-on-error: true

      - name: 生成系列合订 PDF
        id: series_pdf
        if: steps.pdf_deps.outcome == 'success'
        run: |
          python3 -m pip install pyyaml
          python3 scripts/build_series_pdfs.py --self-test
          python3 scripts/tests/test_obsidian2jekyll.py
          python3 scripts/build_series_pdfs.py
        continue-on-error: true

      - name: 记录 PDF 失败
        if: steps.pdf_deps.outcome == 'failure' || steps.series_pdf.outcome == 'failure'
        run: echo "::error title=系列 PDF 生成失败::站点仍会继续构建，但 /assets/pdf/ 可能缺少合订本。请查看上面的 pandoc / XeLaTeX 日志。"

      - name: 构建站点
        run: |
          export JEKYLL_ENV=production
          bundle exec jekyll build

      - name: 删除未使用的 CSS
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js

      - name: 部署到 gh-pages
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: _site

      - name: PDF 失败时把作业标红
        if: steps.pdf_deps.outcome == 'failure' || steps.series_pdf.outcome == 'failure'
        run: |
          echo "::error::系列 PDF 未生成。站点已按原计划部署；请根据 XeLaTeX 日志修复后重跑。"
          exit 1
