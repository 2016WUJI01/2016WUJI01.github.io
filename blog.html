---
layout: default
title: 博客
---

<div class="container">
  {% include page-header.html title="博客文章" subtitle="研究笔记与技术分享" %}

  <div class="post-list">
    {% for post in site.posts %}
      {% include post-item.html post=post %}
    {% endfor %}
  </div>

  {% if site.posts.size == 0 %}
    <div class="empty-state">
      <p>暂无博客文章</p>
      <p>在 <code>_posts/</code> 目录下添加 Markdown 文件即可创建新文章</p>
    </div>
  {% endif %}
</div>
